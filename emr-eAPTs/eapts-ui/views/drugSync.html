<div class="loading" ng-if="loading"><i class="fa fa-spinner fa-spin"></i> Loading...</div>

<div ng-if="!loading">
    <h2><i class="fa fa-pills"></i> Drug Sync</h2>
    <p class="text-muted">Sync drug/item catalog from Dagu to OpenMRS</p>

    <div class="card">
        <div class="card-header">Drug Catalog Sync</div>
        <div class="card-body">
            <p>Fetch the drug/item catalog from Dagu and create missing concepts/drugs in OpenMRS.</p>
            <button class="btn btn-primary" ng-click="syncDrugs()" ng-disabled="syncing">
                <i class="fa fa-refresh" ng-class="{'fa-spin': syncing}"></i> Sync Drug Catalog
            </button>
        </div>
    </div>

    <div class="alert" ng-if="syncResult" ng-class="{'alert-success': syncResult.success, 'alert-danger': !syncResult.success}">
        <strong>{{syncResult.success ? 'Success!' : 'Error!'}}</strong> {{syncResult.message}}
        <pre ng-if="syncResult.data" style="margin-top: 10px; max-height: 200px; overflow: auto;">{{syncResult.data | json}}</pre>
    </div>
</div>
