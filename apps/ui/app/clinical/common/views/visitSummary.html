<section class="visits-navbar-section">
    <div visit-paginator next-fn="::loadVisit" previous-fn="::loadVisit" current-visit-uuid="::visitUuid"
         visits="::visitHistory.visits"
         visit-summary="::visitSummary">
    </div>
</section>

<!-- Visit Search & Date-Time Filter Bar (with standard Ethiopian calendar picker) -->
<section class="visit-search-container" ng-if="!isBeingPrinted" style="margin: 10px 15px 15px 15px; background: #ffffff; border: 1px solid #b2dfdb; border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-left: 4px solid #00796b;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap;">
        <!-- Text Search -->
        <div style="position: relative; flex: 1.2; min-width: 250px; display: flex; align-items: center;">
            <i class="fa fa-search" style="position: absolute; left: 14px; color: #00796b; font-size: 14px; pointer-events: none;"></i>
            <input type="text"
                   class="visit-search-input"
                   ng-model="searchFilter.query"
                   ng-change="applyVisitSearch()"
                   placeholder="Search visit by form name, section, clinician/user..."
                   style="width: 100%; padding: 8px 34px 8px 36px; font-size: 13px; border: 1px solid #80cbc4; border-radius: 20px; outline: none; transition: all 0.2s; background: #fafafa;"
                   onfocus="this.style.borderColor='#00796b'; this.style.boxShadow='0 0 6px rgba(0,121,107,0.3)'; this.style.background='#fff';"
                   onblur="this.style.borderColor='#80cbc4'; this.style.boxShadow='none'; this.style.background='#fafafa';"/>
            <i class="fa fa-times-circle"
               ng-show="searchFilter.query"
               ng-click="clearSearchText()"
               title="Clear text search"
               style="position: absolute; right: 12px; color: #888; font-size: 16px; cursor: pointer;"></i>
        </div>

        <!-- Ethiopian Calendar Date Picker Filter -->
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;">
            <span style="font-size: 12px; font-weight: 600; color: #00796b; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;">
                <i class="fa fa-calendar"></i> ቀን (የኢትዮጵያ):
            </span>
            <div style="width: 150px; display: inline-block;">
                <ethiopian-date-selector date="searchFilter.date"
                                        change="applyVisitSearch()"
                                        allow-future-dates="true"
                                        placeholder="'ቀን (dd/mm/yyyy)'">
                </ethiopian-date-selector>
            </div>
            <i class="fa fa-times-circle"
               ng-show="searchFilter.date"
               ng-click="clearFilterDate()"
               title="Clear date filter"
               style="color: #888; font-size: 16px; cursor: pointer; margin-left: -4px;"></i>
        </div>

        <!-- Optional Time Filter -->
        <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 12px; font-weight: 600; color: #00796b; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;">
                <i class="fa fa-clock-o"></i> ሰዓት:
            </span>
            <input type="time"
                   ng-model="searchFilter.time"
                   ng-change="applyVisitSearch()"
                   style="padding: 5px 8px; border: 1px solid #80cbc4; border-radius: 4px; font-size: 12px; outline: none; background: #fafafa; color: #333;"
                   title="Filter documentation by time"/>
            <i class="fa fa-times-circle"
               ng-show="searchFilter.time"
               ng-click="clearFilterTime()"
               title="Clear time filter"
               style="color: #888; font-size: 16px; cursor: pointer;"></i>
        </div>

        <!-- Match Counter & Reset -->
        <div style="display: flex; align-items: center; gap: 10px; font-size: 13px;">
            <span ng-if="isFilterActive()" class="badge" style="background-color: #00796b; color: #ffffff; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 14px;">
                {{visibleSectionsCount}} matching section(s)
            </span>
            <span ng-if="isFilterActive() && visibleSectionsCount === 0" style="color: #c62828; font-size: 12px; font-weight: bold;">
                <i class="fa fa-exclamation-triangle"></i> No matching records found
            </span>
            <button type="button"
                    class="btn btn-sm"
                    ng-if="isFilterActive()"
                    ng-click="resetAllFilters()"
                    style="background: #e0f2f1; color: #00796b; border: 1px solid #80cbc4; border-radius: 14px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
                <i class="fa fa-refresh"></i> Reset All
            </button>
        </div>
    </div>

    <!-- Active Filter Summary Pills -->
    <div ng-if="isFilterActive()" style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed #b2dfdb; font-size: 12px; color: #555; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <span style="font-weight: 600; color: #00796b;">Active Filter:</span>
        <span ng-if="searchFilter.query" style="background: #e0f2f1; color: #004d40; padding: 2px 8px; border-radius: 10px; border: 1px solid #80cbc4;">
            Text: "{{searchFilter.query}}"
        </span>
        <span ng-if="searchFilter.date" style="background: #e0f2f1; color: #004d40; padding: 2px 8px; border-radius: 10px; border: 1px solid #80cbc4;">
            Ethiopian Date: {{formattedEthDateDisplay}} (GC: {{formattedGregDateDisplay}})
        </span>
        <span ng-if="searchFilter.time" style="background: #e0f2f1; color: #004d40; padding: 2px 8px; border-radius: 10px; border: 1px solid #80cbc4;">
            Time: {{formattedTimeDisplay}}
        </span>
    </div>
</section>

<section ng-if="!isBeingPrinted">
    <ng-include src="'common/views/providerInfo.html'"></ng-include>
</section>

<div ng-if="::(!clearBoard)">
    <div ng-repeat="section in visitTabConfig.currentTab.sections"
         id="visit-section-wrapper-{{$index}}"
         ng-show="isSectionVisible(section, $index)"
         class="visit-section-wrapper"
         data-section-title="{{section.title || section.config.title || (section | titleTranslate)}}">
        <div ng-switch="section.type">
            <div ng-switch-when="patientInformation" class="section">
                <section class="block dashboard-section" >
                    <ng-include src="'common/views/patientInfoPrint.html'"></ng-include>
                </section>
            </div>
            <div ng-switch-when="observation" class="section">
                <div ng-if="::section.config" id="observation-section">
                    <section class="block observation dashboard-section" id="observationSection">
                        <ul bm-gallery access-impression="true">
                            <bahmni-observation patient="::patient" visit-uuid="{{::visitUuid}}"
                                                config="::section.config"
                                                section-title="::section | titleTranslate"
                                                class="section-title"></bahmni-observation>
                        </ul>
                    </section>
                </div>
            </div>
            <div ng-switch-when="vitals" class="section">
                <div ng-if="::section.config" id="vital-section">
                    <section class="block observation dashboard-section" id="vitalSection">
                        <ul bm-gallery access-impression="true">
                            <bahmni-observation patient="::patient" visit-uuid="{{::visitUuid}}"
                                                config="::section.config"
                                                section-title="::section | titleTranslate"
                                                class="section-title"></bahmni-observation>
                        </ul>
                    </section>
                </div>
            </div>
            <div ng-switch-when="consultationNotes" class="section">
                <div ng-if="::section.config" id="consultationNotes-section">
                    <section class="block observation dashboard-section" id="consultationNotesSection">
                        <ul bm-gallery access-impression="true">
                            <bahmni-observation patient="::patient" visit-uuid="{{::visitUuid}}"
                                                config="::section.config"
                                                section-title="::section | titleTranslate"
                                                class="section-title"></bahmni-observation>
                        </ul>
                    </section>
                </div>
            </div>
            <div ng-switch-when="diagnosis" class="section">
                <section ng-if="::section.config" class="block dashboard-section section-title has-link">
                    <h2 ng-hide="::hideTitle" class="section-title" ng-class="::{'hidden-print': (allDiagnoses && allDiagnoses.length == 0)}">
                        <span> {{::section | titleTranslate}} </span>
                    </h2>
                    <bahmni-diagnosis patient-uuid="::patient.uuid" config="::section.config"
                                      visit-uuid="::visitUuid" show-latest-diagnosis="true" hide-title="true"></bahmni-diagnosis>
                </section>
            </div>
            <div ng-switch-when="pivotTable" class="section">
                <div ng-if="::section.config">
                    <section pivot-table visit-uuid="::visitUuid" config="::section.config"
                             patient-uuid="::patient.uuid" display-name="::section | titleTranslate"></section>
                </div>
            </div>
            <div data-ng-switch-when="labOrders" class="section">
                <div ng-if="::section.config">
                    <investigation-results
                            params="::section.config"></investigation-results>
                </div>
            </div>
            <div data-ng-switch-when="radiology">
                <div id="Radiology" ng-if="::section.config"
                         class="dashboard-radiology-section">
                    <bm-documents patient="::patient" config="::section.config"
                                  encounter-type="'RADIOLOGY'"></bm-documents>
                </div>
            </div>
            <div data-ng-switch-when="patientFiles" class="section">
                <div id="Patient-Files" ng-if="section.config && !isBeingPrinted" class="dashboard-radiology-section">
                    <bm-documents patient="::patient" config="::section.config"
                                  encounter-type="'Patient Document'"></bm-documents>
                </div>
            </div>
            <div data-ng-switch-when="prescription" class="section">
                <div ng-if="::section.config">
                    <treatment-data id="visit-treatments" params="::section.config"
                                    patient="patient"
                                    visit-summary="visitSummary"></treatment-data>
                </div>
            </div>
            <div data-ng-switch-when="treatment" class="section">
                <div ng-if="::section.config">
                    <treatment-data id="visit-treatments" params="::section.config"
                                    patient="patient"
                                    visit-summary="visitSummary"></treatment-data>
                </div>
            </div>
            <div data-ng-switch-when="admissionDetails" class="section">
                <div ng-if="::section.config">
                    <admission-details patient-uuid="patient.uuid" params="::section.config"
                                       visit-summary="visitSummary"></admission-details>
                </div>
            </div>
            <div data-ng-switch-when="observationGraph" class="section">
                <section class="block dashboard-section">
                    <div ng-if="::section.config">
                        <observation-graph visit-uuid="visitUuid" params="section"
                                           patient-uuid="patient.uuid"></observation-graph>
                    </div>
                </section>
            </div>
            <div data-ng-switch-when="order" class="section">
                <section class="block order dashboard-section">
                    <div ng-if="::section.config">
                        <orders-control visit-uuid="::visitUuid" patient="patient" section="::section.config"
                                        order-type="section.config.orderType" config="section.config"
                                        show-title="true" section-title="section | titleTranslate"></orders-control>
                    </div>
                </section>
            </div>
            <div data-ng-switch-when="custom" class="section">
                <section class="block dashboard-section">
                    <div ng-if="::section.config">
                        <custom-display-control patient="patient" visit-uuid="::visitUuid"
                                                config="::section.config"
                                                visit-summary="visitSummary"></custom-display-control>
                    </div>
                </section>
            </div>
            <div data-ng-switch-when="pacsOrders">
                <section ng-if="::section.config" class="block dashboard-section">
                    <pacs-orders patient="patient"
                                 order-type="section.config.orderType"
                                 visit-uuid="::visitUuid"
                                 section="section"
                                 config="::section.config">
                    </pacs-orders>
                </section>
            </div>
            <div data-ng-switch-when="conditionsList" class="section">
                <conditions-list params="section" patient="patient"></conditions-list>
            </div>
            <div data-ng-switch-when="followUp" class="section">
                <section class="block observation dashboard-section" id="follow-up">
                    <ul bm-gallery access-impression="true">
                        <bahmni-observation patient="::patient" visit-uuid="{{::visitUuid}}"
                                            config="::section.config"
                                            section-title="::section | titleTranslate"
                                            class="section-title"></bahmni-observation>
                    </ul>
                </section>
            </div>
        </div>
    </div>
</div>
