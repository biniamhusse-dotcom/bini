<div class="ngdialog-message" style="padding: 15px;">
    <h3 style="margin-top: 0; color: #92400e; border-bottom: 1px solid #fcd34d; padding-bottom: 8px;">
        <i class="fa fa-wrench" style="color: #d97706;"></i>
        Fix General Prescription Evaluation &amp; Resend
    </h3>

    <div style="background-color: #fffbeb; border: 1px solid #fcd34d; color: #92400e; padding: 10px; border-radius: 5px; margin-bottom: 12px; font-size: 13px;">
        <div><strong>Priority:</strong> {{generalFixModal.issue.priority || 'Normal'}}</div>
        <div style="margin-top: 4px;"><strong>Issue(s) Reported:</strong> {{generalFixModal.issue.summary}}</div>
        <div ng-if="generalFixModal.issue.reportedBy" style="margin-top: 4px; font-size: 12px; color: #78350f;">
            Reported by: {{generalFixModal.issue.reportedBy}}
        </div>
    </div>

    <div style="margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
        <button type="button" class="secondary-button" ng-click="goToConsultationTab('diagnosis')" style="font-size: 12px; padding: 5px 10px;">
            <i class="fa fa-stethoscope"></i> Open Diagnosis Tab
        </button>
        <button type="button" class="secondary-button" ng-click="goToConsultationTab('observations')" style="font-size: 12px; padding: 5px 10px;">
            <i class="fa fa-heartbeat"></i> Open Observations / Vitals
        </button>
    </div>

    <div style="border-top: 1px solid #ddd; padding-top: 10px;">
        <label style="display: block; font-weight: bold; margin-bottom: 4px; color: #333;">
            Physician Fix Note / Explanation <span style="color: #d9534f;">*</span>
        </label>
        <textarea ng-model="generalFixModal.physicianReply" rows="3"
                  style="width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"
                  placeholder="Describe what was fixed (e.g., Diagnosis documented, patient weight/profile updated)..."></textarea>

        <div style="margin-top: 10px;">
            <label style="cursor: pointer; font-weight: normal;">
                <input type="checkbox" ng-model="generalFixModal.resendFullPrescription" />
                Resend full active prescription to pharmacy (all active drugs without duplicates)
            </label>
        </div>

        <div ng-if="generalFixModal.error" style="color: #d9534f; margin-top: 6px; font-size: 12px;">
            {{generalFixModal.error}}
        </div>

        <div style="margin-top: 14px; text-align: right;">
            <button type="button" class="secondary-button" ng-click="closeGeneralFixModal()" style="margin-right: 8px;">
                Cancel
            </button>
            <button type="button" class="confirm" ng-click="submitGeneralRxFix()" ng-disabled="generalFixModal.submitting"
                    style="background-color: #28a745; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer;">
                <i class="fa fa-paper-plane"></i>
                {{generalFixModal.submitting ? 'Saving & Sending...' : (generalFixModal.resendFullPrescription ? 'Save Fix & Resend Prescription' : 'Save Fix')}}
            </button>
        </div>
    </div>
</div>
