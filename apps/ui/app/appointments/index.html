<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Appointment Scheduling</title>
    <link rel="shortcut icon" type="image/x-icon" href="/bahmni/favicon.ico">
    <link rel="icon" type="image/x-icon" href="/bahmni/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Ethiopian Calendars CSS -->
    <link rel="stylesheet" href="lib/jquery-calendars/css/jquery.calendars.picker.css">
    
    <!-- Main Appointment Scheduling App Bundle -->
    <script type="text/javascript" src="appointment.js"></script>
    <style>
    .back-btn-spec {
        display: inline-block;
        padding: 5px 12px !important;
        margin: 15px 5px 0 !important;
        border-radius: 3px;
        color: #fff !important;
        background: rgba(255,255,255,0.15);
        font-size: 13px;
        text-decoration: none !important;
        border: 1px solid rgba(255,255,255,0.3);
    }
    .back-btn-spec:hover { background: rgba(255,255,255,0.3); }

    /* Ethiopian Calendar Picker Styles */
    .calendars-popup {
        z-index: 9999999 !important;
        font-family: 'Segoe UI', 'Nyala', 'Ebrima', Tahoma, Arial, sans-serif !important;
        border-radius: 8px !important;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18) !important;
        background: #fff !important;
        border: 1px solid #b2dfdb !important;
        overflow: hidden !important;
        width: auto !important;
        height: auto !important;
        padding: 0 !important;
    }
    .calendars {
        border-radius: 8px !important;
        border: none !important;
        font-family: inherit !important;
        background: #fff !important;
        width: 280px !important;
        margin: 0 !important;
        position: static !important;
    }
    /* Hide clunky Clear/Close bar; selection automatically closes the picker */
    .calendars-ctrl {
        display: none !important;
    }
    .calendars-nav {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        float: none !important;
        width: 100% !important;
        box-sizing: border-box !important;
        background: linear-gradient(135deg, #00796B 0%, #00695C 100%) !important;
        color: #fff !important;
        font-weight: 600 !important;
        padding: 8px 10px !important;
        font-size: 13px !important;
    }
    .calendars-nav a, .calendars-nav .calendars-cmd {
        float: none !important;
        width: auto !important;
        height: auto !important;
        line-height: 1.4 !important;
        color: #fff !important;
        font-weight: 600 !important;
        padding: 4px 10px !important;
        margin: 0 !important;
        cursor: pointer !important;
        text-decoration: none !important;
        border-radius: 4px !important;
        white-space: nowrap !important;
        box-sizing: border-box !important;
        text-align: center !important;
    }
    .calendars-nav a:hover {
        background-color: rgba(255,255,255,0.22) !important;
        color: #fff !important;
    }
    .calendars-month-header {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 8px !important;
        height: auto !important;
        min-height: 40px !important;
        background-color: #f4fbf9 !important;
        font-weight: bold !important;
        color: #004d40 !important;
        padding: 6px 10px !important;
        font-size: 13px !important;
        border-bottom: 1px solid #d0ece8 !important;
        box-sizing: border-box !important;
    }
    .calendars-month-header select {
        height: 30px !important;
        line-height: normal !important;
        padding: 2px 8px !important;
        border-radius: 5px !important;
        border: 1px solid #b2dfdb !important;
        font-size: 13px !important;
        font-family: 'Segoe UI', 'Nyala', 'Ebrima', Tahoma, Arial, sans-serif !important;
        font-weight: 600 !important;
        color: #004d40 !important;
        background: #fff !important;
        cursor: pointer !important;
    }
    .calendars-month {
        width: 100% !important;
        border: none !important;
        float: none !important;
    }
    .calendars-month table {
        width: 100% !important;
        border-collapse: separate !important;
        border-spacing: 2px !important;
        padding: 6px !important;
        background: #fff !important;
        box-sizing: border-box !important;
    }
    .calendars-month th {
        background-color: #f1f8f6 !important;
        color: #00796B !important;
        font-weight: 600 !important;
        padding: 6px 2px !important;
        font-size: 12px !important;
        line-height: 1.4 !important;
        font-family: 'Segoe UI', 'Nyala', 'Ebrima', Tahoma, Arial, sans-serif !important;
        border-bottom: 1px solid #e0f2f1 !important;
        text-align: center !important;
    }
    .calendars-month td {
        padding: 1px !important;
        background: transparent !important;
        border: none !important;
    }
    .calendars-month td a, .calendars-month td span {
        padding: 6px 4px !important;
        display: block !important;
        text-align: center !important;
        border-radius: 6px !important;
        font-size: 13px !important;
        line-height: 1.3 !important;
    }
    .calendars-month td a {
        color: #2c3e50 !important;
        font-weight: 500 !important;
        cursor: pointer !important;
        text-decoration: none !important;
        transition: background 0.15s ease, color 0.15s ease !important;
    }
    .calendars-month td a:hover, .calendars-highlight {
        background-color: #b2dfdb !important;
        color: #004d40 !important;
    }
    .calendars-selected {
        background-color: #00796B !important;
        color: #fff !important;
        font-weight: 700 !important;
        border-radius: 6px !important;
    }
    .calendars-today {
        background-color: #e0f2f1 !important;
        color: #004d40 !important;
        font-weight: 700 !important;
        border: 1px solid #00796B !important;
        border-radius: 6px !important;
    }

    /* Ethiopian Date Input in Drawer Form */
    .eth-date-picker-input {
        cursor: pointer !important;
        background-color: #fff !important;
    }
    .eth-date-picker-input:focus {
        border-color: #00796B !important;
        outline: none !important;
        box-shadow: 0 0 5px rgba(0, 121, 107, 0.4) !important;
    }

    /* Ethiopian Date Input in Navigation Bar */
    .eth-date-nav-input {
        width: 215px !important;
        padding: 5px 10px !important;
        border: 1px solid #b0bec5 !important;
        border-radius: 4px !important;
        font-size: 13px !important;
        text-align: center !important;
        background: #ffffff !important;
        cursor: pointer !important;
        font-weight: 600 !important;
        color: #004d40 !important;
        letter-spacing: 0.3px;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
    }
    .eth-date-nav-input:hover, .eth-date-nav-input:focus {
        border-color: #00796B !important;
        outline: none !important;
        box-shadow: 0 0 5px rgba(0, 121, 107, 0.4) !important;
    }
    
    /* Flexible Responsive Drawer Styles */
    .AddAppointment_overlay__Fx6M5 {
        width: clamp(520px, 44vw, 680px) !important;
        min-width: 500px !important;
        transition: width 0.25s ease !important;
    }
    .AddAppointment_appointmentEditor__eekwa {
        padding-bottom: 300px !important; /* Generous bottom room so date/time never hit the bottom edge */
    }

    /* Flexible Time Selectors */
    div[data-testid="start-time-selector"],
    div[data-testid="end-time-selector"],
    span[data-testid="recurring-start-time-selector"],
    span[data-testid="recurring-end-time-selector"] {
        flex: 1 1 0% !important;
        min-width: 140px !important;
    }
    div[data-testid="start-time-selector"] .bx--time-picker,
    div[data-testid="end-time-selector"] .bx--time-picker,
    span[data-testid="recurring-start-time-selector"] .bx--time-picker,
    span[data-testid="recurring-end-time-selector"] .bx--time-picker {
        display: flex !important;
        width: 100% !important;
    }
    div[data-testid="start-time-selector"] .bx--time-picker__input,
    div[data-testid="end-time-selector"] .bx--time-picker__input,
    span[data-testid="recurring-start-time-selector"] .bx--time-picker__input,
    span[data-testid="recurring-end-time-selector"] .bx--time-picker__input {
        flex: 1 1 0% !important;
        min-width: 75px !important;
    }
    div[data-testid="start-time-selector"] .bx--time-picker__input-field,
    div[data-testid="end-time-selector"] .bx--time-picker__input-field,
    span[data-testid="recurring-start-time-selector"] .bx--time-picker__input-field,
    span[data-testid="recurring-end-time-selector"] .bx--time-picker__input-field {
        width: 100% !important;
        padding-left: 0.75rem !important;
        font-weight: 500 !important;
    }
    div[data-testid="start-time-selector"] .bx--time-picker__select,
    div[data-testid="end-time-selector"] .bx--time-picker__select,
    span[data-testid="recurring-start-time-selector"] .bx--time-picker__select,
    span[data-testid="recurring-end-time-selector"] .bx--time-picker__select {
        width: 68px !important;
        flex-shrink: 0 !important;
    }

    /* Flexible Date Picker Input */
    .eth-date-picker-input {
        width: 100% !important;
        max-width: 320px !important;
        font-family: inherit !important;
        font-size: 14px !important;
    }
    .bx--date-picker-container {
        width: 100% !important;
    }
    .bx--date-picker-input__wrapper {
        max-width: 320px !important;
        width: 100% !important;
    }

    /* Fixed Popup never clipped */
    .calendars-popup {
        max-height: calc(100vh - 20px) !important;
        overflow-y: auto !important;
    }

    </style>
</head>
<body>
<div class="bahmni-appointments">
    <div ui-view="additional-header"></div>
    <div ng-include src="'ui-helper-messages'"></div>
    <div ui-view="mainContent"></div>
</div>
<script>
(function() {
    var checkCount = 0;
    var checkInterval = setInterval(function() {
        checkCount++;
        var headerUl = document.querySelector('.opd-header-wrapper .opd-header-top header ul');
        if (headerUl && !document.querySelector('.speciality-admin-link')) {
            var li = document.createElement('li');
            li.style.display = 'inline';
            var link1 = document.createElement('a');
            link1.className = 'back-btn-spec speciality-admin-link';
            link1.href = '/appointments/speciality-admin.html';
            link1.textContent = 'MANAGE SPECIALITIES';
            li.appendChild(link1);

            var li2 = document.createElement('li');
            li2.style.display = 'inline';
            var link2 = document.createElement('a');
            link2.className = 'back-btn-spec provider-admin-link';
            link2.href = '/appointments/provider-admin.html';
            link2.textContent = 'MANAGE PROVIDERS';
            li2.appendChild(link2);

            headerUl.appendChild(li);
            headerUl.appendChild(li2);
            clearInterval(checkInterval);
        }
        if (checkCount > 100) clearInterval(checkInterval);
    }, 300);
})();
</script>

<script>
// Background prefetch for instant "Add new appointment" drawer opening
(function prefetchProviders() {
    var url = '/openmrs/ws/rest/v1/provider?limit=1000&v=custom:(display,person,uuid,retired,attributes:(attributeType:(display),value,voided))';
    if (!window.__bahmni_providers_cache && !window.__bahmni_providers_promise) {
        window.__bahmni_providers_promise = fetch(url, { credentials: 'same-origin' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data && data.results) {
                    var filtered = data.results.filter(function(p) {
                        return !p.retired && p.attributes && p.attributes.some(function(a) {
                            return !a.voided && a.value && a.attributeType && a.attributeType.display === 'Available for Appointments';
                        });
                    });
                    window.__bahmni_providers_cache = filtered;
                    return filtered;
                }
                return [];
            })
            .catch(function(err) {
                console.warn('Background provider prefetch error:', err);
                window.__bahmni_providers_promise = null;
                return [];
            });
    }
})();

// Re-position or close popup on drawer scroll to avoid orphaning
document.addEventListener('scroll', function(e) {
    var popup = document.querySelector('.calendars-popup');
    if (popup && popup.style.display !== 'none') {
        var input = document.querySelector('.eth-date-picker-input');
        if (input) {
            var r = input.getBoundingClientRect();
            var pH = popup.offsetHeight || 260;
            var pW = popup.offsetWidth || 232;
            var winH = window.innerHeight;
            var winW = window.innerWidth;
            if (r.bottom < 50 || r.top > winH - 50) {
                // Input scrolled off screen, hide popup
                if (window.jQuery && window.jQuery(input).calendarsPicker) {
                    window.jQuery(input).calendarsPicker('hide');
                }
            } else {
                var top;
                if (winH - r.bottom < pH && r.top > pH) {
                    top = r.top - pH - 4;
                } else {
                    top = r.bottom + 4;
                }
                top = Math.max(10, Math.min(top, winH - pH - 10));
                var left = Math.max(10, Math.min(r.left, winW - pW - 10));
                popup.style.top = top + 'px';
                popup.style.left = left + 'px';
            }
        }
    }
}, true);
</script>

</body>
</html>
