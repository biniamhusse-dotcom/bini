<div id="{{conceptSet.id}}" style="position: relative;">
    <div class="concept-set-title">
        <div id="{{getNormalized(conceptSet.conceptName)}}">
            <h2 class="section-title">
                <span class="section-label">{{conceptSet.label}}</span>
            </h2>
            <div class="form-actions fr">
                <a ng-if="conceptSet.conceptName === 'WHO Emergency Unit Form - Trauma'" 
                   ng-href="{{'/bahmni_config/openmrs/apps/custemForms/WHO%20Emergency%20Unit%20Form_%20Trauma.html?patientUuid=' + patient.uuid}}" 
                   target="_blank" 
                   title="Open in new window"
                   style="margin-right: 8px; color: #2563eb; font-size: 13px; text-decoration: none; vertical-align: middle;">
                    <i class="fa fa-external-link"></i> Full Form
                </a>
                <a ng-if="conceptSet.conceptName === 'WHO Labour Care Guide'" 
                   ng-href="{{'/bahmni_config/openmrs/apps/custemForms/WHO%20Labour%20Care%20Guide.html?patientUuid=' + patient.uuid}}" 
                   target="_blank" 
                   title="Open in new window"
                   style="margin-right: 8px; color: #0d9488; font-size: 13px; text-decoration: none; vertical-align: middle; font-weight: bold;">
                    <i class="fa fa-external-link"></i> Full Form
                </a>
                <a ng-if="conceptSet.conceptName === 'Ethiopian OTP Follow-Up Card'" 
                   ng-href="{{'/bahmni_config/openmrs/apps/custemForms/ethiopian_otp_follow_up_card.html?patientUuid=' + patient.uuid}}" 
                   target="_blank" 
                   title="Open in new window"
                   style="margin-right: 8px; color: #16a34a; font-size: 13px; text-decoration: none; vertical-align: middle; font-weight: bold;">
                    <i class="fa fa-external-link"></i> Full Form
                </a>
                <a ng-if="conceptSet.conceptName === 'FMOH Ethiopia DM and Hypertension Follow-Up Form'" 
                   ng-href="{{'/bahmni_config/openmrs/apps/custemForms/fmoh_ethiopia_dm_hypertension_follow_up_form.html?patientUuid=' + patient.uuid}}" 
                   target="_blank" 
                   title="Open in new window"
                   style="margin-right: 8px; color: #0284c7; font-size: 13px; text-decoration: none; vertical-align: middle; font-weight: bold;">
                    <i class="fa fa-external-link"></i> Full Form
                </a>
                <a ng-if="conceptSet.conceptName === 'Ophthalmic and Optometric Eye Examination Record'" 
                   ng-href="{{'/bahmni_config/openmrs/apps/custemForms/interactive_ophthalmic_eye_examination_form.html?patientUuid=' + patient.uuid}}" 
                   target="_blank" 
                   title="Open in new window"
                   style="margin-right: 8px; color: #7c3aed; font-size: 13px; text-decoration: none; vertical-align: middle; font-weight: bold;">
                    <i class="fa fa-external-link"></i> Full Form
                </a>
                <a ng-if="conceptSet.conceptName === 'National Perioperative Clinical Forms'" 
                   ng-href="{{'/bahmni_config/openmrs/apps/custemForms/National_Perioperative_Clinical_Forms.html?patientUuid=' + patient.uuid}}" 
                   target="_blank" 
                   title="Open in new window"
                   style="margin-right: 8px; color: #ea580c; font-size: 13px; text-decoration: none; vertical-align: middle; font-weight: bold;">
                    <i class="fa fa-external-link"></i> Full Form
                </a>
                <a ng-if="conceptSet.conceptName === 'Safe Childbirth Checklist Ethiopian'" 
                   ng-href="{{'/bahmni_config/openmrs/apps/custemForms/safe_childbirth_checklist_ethiopian.html?patientUuid=' + patient.uuid}}" 
                   target="_blank" 
                   title="Open in new window"
                   style="margin-right: 8px; color: #d97706; font-size: 13px; text-decoration: none; vertical-align: middle; font-weight: bold;">
                    <i class="fa fa-external-link"></i> Full Form
                </a>
                <a ng-if="conceptSet.conceptName === 'Stabilisation Centre Multi-Chart'" 
                   ng-href="{{'/bahmni_config/openmrs/apps/custemForms/stabilisation_centre_sc_multi_chart_with_ethiopian_calendar_picker.html?patientUuid=' + patient.uuid}}" 
                   target="_blank" 
                   title="Open in new window"
                   style="margin-right: 8px; color: #0d9488; font-size: 13px; text-decoration: none; vertical-align: middle; font-weight: bold;">
                    <i class="fa fa-external-link"></i> Full Form
                </a>
                <a ng-if="conceptSet.conceptName === 'WHO Postpartum Hemorrhage Observation Chart'" 
                   ng-href="{{'/bahmni_config/openmrs/apps/custemForms/who_postpartum_hemorrhage_pph_clinical_observation_chart.html?patientUuid=' + patient.uuid}}" 
                   target="_blank" 
                   title="Open in new window"
                   style="margin-right: 8px; color: #dc2626; font-size: 13px; text-decoration: none; vertical-align: middle; font-weight: bold;">
                    <i class="fa fa-external-link"></i> Full Form
                </a>
                <a ng-if="conceptSet.conceptName === 'Psychiatric Intake and Mental Health History'" 
                   ng-href="{{'/bahmni_config/openmrs/apps/custemForms/mental_health_hx.html?patientUuid=' + patient.uuid}}" 
                   target="_blank" 
                   title="Open in new window"
                   style="margin-right: 8px; color: #0F4C81; font-size: 13px; text-decoration: none; vertical-align: middle; font-weight: bold;">
                    <i class="fa fa-external-link"></i> Full Form
                </a>

                <button type="button"  ng-if="conceptSet.isOpen" ng-click="conceptSet.maximizeInnerSections($event)"
                        title="{{ ::'CONCEPT_SET_GROUP_EXPAND_ALL_KEY' | translate}}">
                       <i class="fa icon-bahmni-expand"></i>
                </button>
                <button type="button" ng-if="conceptSet.isOpen" ng-click="conceptSet.minimizeInnerSections($event)"
                        title="{{ ::'CONCEPT_SET_GROUP_COLLAPSE_ALL_KEY' | translate}}">
                    <i class="fa icon-bahmni-collapse"></i>
                </button>
                <label class="add-fav" title="{{ ::'CONCEPT_SET_GROUP_PIN_UNPIN_KEY' | translate}}">
                    <input type="checkbox" id="hasOldIdentifier" ng-model="conceptSet.alwaysShow"
                           ng-change="togglePref(conceptSet, conceptSet.conceptName)"/>
                    <i class="fa fa-thumb-tack"></i>
                </label>
                <button type="button" ng-confirm-click="remove($index)" ng-disabled="!canRemove($index)"
                        title="{{ ::'CONCEPT_SET_GROUP_REMOVE_KEY' | translate}}"
                    confirm-message="{{::'REMOVE_CONFIRMATION_KEY' | translate}}">
                        <i class="fa fa-trash"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Custom HTML Forms Iframe Embeddings -->
    <div ng-if="conceptSet.conceptName === 'WHO Emergency Unit Form - Trauma'" ng-show="conceptSet.isOpen" style="margin-top: 10px;">
        <who-trauma-iframe patient="patient" consultation="consultation"></who-trauma-iframe>
    </div>
    <div ng-if="conceptSet.conceptName === 'WHO Labour Care Guide'" ng-show="conceptSet.isOpen" style="margin-top: 10px;">
        <who-labour-care-guide-iframe patient="patient" consultation="consultation"></who-labour-care-guide-iframe>
    </div>
    <div ng-if="conceptSet.conceptName === 'Ethiopian OTP Follow-Up Card'" ng-show="conceptSet.isOpen" style="margin-top: 10px;">
        <ethiopian-otp-follow-up-card-iframe patient="patient" consultation="consultation"></ethiopian-otp-follow-up-card-iframe>
    </div>
    <div ng-if="conceptSet.conceptName === 'FMOH Ethiopia DM and Hypertension Follow-Up Form'" ng-show="conceptSet.isOpen" style="margin-top: 10px;">
        <fmoh-dm-hypertension-iframe patient="patient" consultation="consultation"></fmoh-dm-hypertension-iframe>
    </div>
    <div ng-if="conceptSet.conceptName === 'Ophthalmic and Optometric Eye Examination Record'" ng-show="conceptSet.isOpen" style="margin-top: 10px;">
        <ophthalmic-eye-examination-iframe patient="patient" consultation="consultation"></ophthalmic-eye-examination-iframe>
    </div>
    <div ng-if="conceptSet.conceptName === 'National Perioperative Clinical Forms'" ng-show="conceptSet.isOpen" style="margin-top: 10px;">
        <national-perioperative-iframe patient="patient" consultation="consultation"></national-perioperative-iframe>
    </div>
    <div ng-if="conceptSet.conceptName === 'Safe Childbirth Checklist Ethiopian'" ng-show="conceptSet.isOpen" style="margin-top: 10px;">
        <safe-childbirth-checklist-iframe patient="patient" consultation="consultation"></safe-childbirth-checklist-iframe>
    </div>
    <div ng-if="conceptSet.conceptName === 'Stabilisation Centre Multi-Chart'" ng-show="conceptSet.isOpen" style="margin-top: 10px;">
        <stabilisation-centre-multi-chart-iframe patient="patient" consultation="consultation"></stabilisation-centre-multi-chart-iframe>
    </div>
    <div ng-if="conceptSet.conceptName === 'WHO Postpartum Hemorrhage Observation Chart'" ng-show="conceptSet.isOpen" style="margin-top: 10px;">
        <who-pph-observation-chart-iframe patient="patient" consultation="consultation"></who-pph-observation-chart-iframe>
    </div>
    <div ng-if="conceptSet.conceptName === 'Psychiatric Intake and Mental Health History'" ng-show="conceptSet.isOpen" style="margin-top: 10px;">
        <mental-health-hx-iframe patient="patient" consultation="consultation"></mental-health-hx-iframe>
    </div>

    <!-- Default Concept Set Forms -->
    <div ng-if="!isCustomHtmlForm(conceptSet.conceptName) && !isFormTemplate(conceptSet)">
        <concept-set ng-if="conceptSet.isLoaded" patient="::patient" ng-show="conceptSet.isOpen"
                     collapse-inner-sections="conceptSet.collapseInnerSections"
                     concept-set-name="::conceptSet.conceptName"
                     concept-set-uuid="::conceptSet.uuid"
                     required="conceptSet.options.required"
                     at-least-one-value-is-set="conceptSet.atLeastOneValueIsSet"
                     observations="conceptSet.observations" show-title="::false"
                     validation-handler="::validationHandler"
                     section-id="conceptSet.id">
        </concept-set>
    </div>
    <div ng-if="isFormTemplate(conceptSet) && !isCustomHtmlForm(conceptSet.conceptName)" id={{::conceptSet.formUuid}} class="form-controls-container">
        <form-controls form="conceptSet" patient="patient" validate-form="false"></form-controls>
    </div>
</div>
